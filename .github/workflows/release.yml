name: Release

# Cut a release by hand from the Actions tab (or `gh workflow run release.yml
# -f bump=minor`). The job bumps the version, regenerates the single-header
# amalgamation, updates the download URLs in README.md, commits, tags, pushes,
# and publishes a GitHub release with singleheader/perfect_hash.h attached.
#
# The attached header must build against nothing but the standard library, so
# the job proves that before anything is pushed.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Report what would change and stop"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ inputs.bump }})
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HTTPS credentials for the private dependency the amalgamation bundles.
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.USEFUL_ABSTRACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y g++-14

      - name: Show what would change
        run: python3 tools/release.py --${{ inputs.bump }} --dry-run

      - name: Stop here (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run requested; nothing was written, committed or pushed." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Configure git identity
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps CMakeLists.txt, the version header and the README download URLs,
      # regenerates singleheader/perfect_hash.h, then commits and tags.
      - name: Bump version and regenerate the amalgamation
        if: ${{ !inputs.dry_run }}
        run: python3 tools/release.py --${{ inputs.bump }}

      - name: Read the released version
        if: ${{ !inputs.dry_run }}
        id: version
        run: echo "version=$(python3 tools/release.py --show-version)" >> "$GITHUB_OUTPUT"

      # Fail closed: if the header is not self-contained, nothing gets pushed.
      - name: Verify the amalgamation is current
        if: ${{ !inputs.dry_run }}
        run: python3 singleheader/amalgamate.py --check --fetch

      - name: Verify the header needs only the standard library
        if: ${{ !inputs.dry_run }}
        env:
          CXX: g++-14
        run: python3 tools/test_packaging.py --only dropin

      - name: Verify it still works as a CMake dependency
        if: ${{ !inputs.dry_run }}
        env:
          CC: gcc-14
          CXX: g++-14
        run: python3 tools/test_packaging.py --only fetchcontent find_package

      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release_notes.md <<EOF
          ## Version ${VERSION}

          Compile-time perfect hashing for C++23.

          ### Drop-in single header

          \`perfect_hash.h\` below is the whole library, dependencies included.
          It needs nothing but a C++23 standard library.

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/perfect_hash.h
          c++ -std=c++23 -O2 main.cpp -o main
          \`\`\`

          \`\`\`cpp
          #include "perfect_hash.h"

          constexpr auto methods = ConstexprCore::make_perfect_set<"GET", "POST", "PUT">();
          \`\`\`

          ### CMake

          \`\`\`cmake
          include(FetchContent)
          FetchContent_Declare(
              perfect_hash
              GIT_REPOSITORY https://github.com/${GITHUB_REPOSITORY}.git
              GIT_TAG        v${VERSION}
          )
          FetchContent_MakeAvailable(perfect_hash)
          target_link_libraries(my_app PRIVATE ConstexprCore::perfect_hash)
          \`\`\`

          See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/README.md) for \`find_package\` and other options.
          EOF

          gh release create "v${VERSION}" \
            singleheader/perfect_hash.h \
            --title "Version ${VERSION}" \
            --notes-file release_notes.md

          {
            echo "### Released v${VERSION}"
            echo
            echo "- tag: \`v${VERSION}\`"
            echo "- asset: \`perfect_hash.h\` (self-contained, standard library only)"
            echo "- README download URLs updated to v${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
